version: '3.8'

services:
  ml-backend-temperature:
    build: .
    container_name: temperature-annotation-ml-backend
    ports:
      - "9090:9090"
    environment:
      - MODEL_VERSION=temperature_v1.0
      - LOG_LEVEL=INFO
      - WORKERS=1
      - THREADS=8
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
