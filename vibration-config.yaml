# 振动数据PHM预测性维护项目配置
# --------------项目配置部分-----------------------
# 项目名称
project: vibration_phm
# 可选，对项目的描述
project_description: '工业设备振动数据预测性维护标注项目'
# 如果该项目已创建，请填写项目id，否则保持为空(null)
project_id: null
# 项目数据类型,'Timeseries'(时序数据)或者'Image'(图像数据)
project_data_type: 'Timeseries'

# --------------通用数据部分-------------------
# 需要的炮号，支持int(单炮)，List(炮号列表)，Dict(炮号最大值和最小值)
shots:
  min: 240829001
  max: 240829100
# 读取数据的最小起始时间和最大结束时间      
t_min: 0
t_max: 60  # 60秒振动数据
# 时间分辨率，以秒为单位，默认1e-4
resolution: 0.001  # 1ms分辨率
# 导出数据在服务器中的存储路径,为空则与project相同
file_path: null  

# --------------时序数据部分-------------------
# 原始数据格式。注意，之后处理后的数据使用的原始数据通道也应该包含在其中
raw_data:
  vibration_x:
    data_table_name: vibration_sensors
    channels:
      - x_axis
  vibration_y:
    data_table_name: vibration_sensors
    channels:
      - y_axis
  vibration_z:
    data_table_name: vibration_sensors
    channels:
      - z_axis
  rotation_speed:
    data_table_name: rotation_sensors
    channels:
      - rpm

# 处理数据及其表达式
# name为新数据的名称，不能和raw_data中的数据名相同
# expression为处理数据的表达式，目前仅支持四则运算
# 注意：表达式的计算符号应该使用SQL格式，其中涉及的数据必须在raw_data出现过，且使用 data_name[channel_name] 的格式
processed_data:
  - name: vibration_amplitude
    expression: 'sqrt(vibration_x[x_axis]^2 + vibration_y[y_axis]^2 + vibration_z[z_axis]^2)'
  - name: speed_normalized
    expression: 'rotation_speed[rpm]/1000'

# 是否保留使用过的原始数据，若为true，最后上传到项目的数据会包括在processed_data中使用过的数据。默认为false    
keep_used_raw_data: false
# 是否将所有数据保存在视图中。若为true，创建的视图会包括所有数据，否则只包括processed_data。默认为false
including_raw_data: false
# 筛选符合要求的数据，目前只支持max(...) < value, max(...) > value, min(...) < value, min(...) > value
filter:
  - max(vibration_amplitude) > 0.1
  - max(rotation_speed[rpm]) > 100

# -----------------图像数据部分--------------------------
# 是否使用SAM2进行辅助标注，这将影响到标注界面的内容和风格
using_SAM2: false
# 是否使用时序数据内容帮助筛选放电炮号
using_TimeSeries_filter: false  

# -----------------标签配置部分--------------------------  
# 项目标签配置
label_config:
  - name: speed_level
    type: TimeSeriesLabels
    choices:
      - 低转速
      - 中转速
      - 高转速
  - name: fault_type
    type: TimeSeriesLabels
    choices:
      - 正常
      - 不平衡
      - 轴承故障
      - 齿轮故障
  - name: quality_score
    type: Number
    min: 0
    max: 100
  - name: confidence_level
    type: Number
    min: 0
    max: 1
