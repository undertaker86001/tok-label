version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: toklabel-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - toklabel-network

  redis:
    image: redis:7-alpine
    container_name: toklabel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - toklabel-network

  postgres:
    image: postgres:15-alpine
    container_name: toklabel-postgres
    environment:
      POSTGRES_DB: toklabel
      POSTGRES_USER: toklabel
      POSTGRES_PASSWORD: toklabel123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - toklabel-network

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: toklabel-labelstudio
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: "/data"
    volumes:
      - label_studio_data:/data
      - ./data:/data/upload
    networks:
      - toklabel-network

volumes:
  minio_data:
  redis_data:
  postgres_data:
  label_studio_data:

networks:
  toklabel-network:
    driver: bridge
